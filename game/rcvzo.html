<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Nivell 1</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

h1{
    margin-top:30px;
}

#container{
    position:relative;
    display:inline-block;
    margin-top:30px;
}

#container img{
    border:4px solid white;
}

.zone{
    position:absolute;
    cursor:pointer;
}

#z1{
    top:80px;
    left:100px;
    width:120px;
    height:120px;
}

#z2{
    top:250px;
    left:500px;
    width:150px;
    height:100px;
}

#hint{
    margin-top:25px;
    min-height:30px;
    font-size:20px;
    color:gold;
}

input{
    margin-top:30px;
    width:250px;
    padding:12px;
    font-size:18px;
    text-align:center;
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>NIVELL 1</h1>

<div id="container">

    <!-- Canvia aquesta imatge -->
    <img src="qr.png" width="200px" height="200px"> 

    <!-- Zones invisibles -->

    <div id="z2" class="zone" onclick="hint('Mira enllaç')"></div>

</div>

<div id="hint">
    Escaneja'm!
</div>

<br>

<input id="answer" placeholder="Resposta...">

<button onclick="check()">
Enviar
</button>

<script>

function hint(text){

    document.getElementById("hint").innerHTML = text;

}

function check(){

    let ans=document.getElementById("answer").value.toLowerCase();

    if(ans=="aleix"){
        alert("Correcte!");
        // Aquí després canviaràs l'enllaç
        location.href="aleix.html";
    }
    else{
        alert("Incorrecte.");
    }

}

</script>

</body>
</html>
